{% extends "base.html" %}

{% block title %}CPE Mapping Browser{% endblock %}

{% block extra_head %}
<style>
	.filter-bar {
		display: flex;
		flex-wrap: wrap;
		gap: .75rem;
		align-items: flex-end;
		margin-bottom: 1.25rem;
	}
	.filter-bar .form-group {
		display: flex;
		flex-direction: column;
	}
	.filter-bar label {
		font-size: .8rem;
		font-weight: 500;
		margin-bottom: .2rem;
		color: #555;
	}
	.filter-bar select,
	.filter-bar input {
		font-size: .85rem;
		padding: .35rem .5rem;
		border: 1px solid #ccc;
		border-radius: 4px;
		min-width: 180px;
	}
	.filter-bar .btn-sm {
		font-size: .8rem;
		padding: .4rem .75rem;
	}
	.stats-bar {
		font-size: .82rem;
		color: #666;
		margin-bottom: .5rem;
	}
	.stat-cards {
		display: flex;
		flex-wrap: wrap;
		gap: .75rem;
		margin-bottom: 1.25rem;
	}
	.stat-card {
		background: #fff;
		border: 1px solid #e0e0e0;
		border-radius: 6px;
		padding: .6rem 1.1rem;
		min-width: 140px;
		text-align: center;
	}
	.stat-card .stat-value {
		font-size: 1.5rem;
		font-weight: 700;
		color: #333;
	}
	.stat-card .stat-label {
		font-size: .75rem;
		color: #888;
		text-transform: uppercase;
		letter-spacing: .3px;
	}
	#cpe-table {
		font-size: .85rem;
	}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
	<h4 class="mb-3">CPE Mapping Browser</h4>

	<!-- Stat Cards -->
	<div class="stat-cards" id="statCards">
		<div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total Records</div></div>
		<div class="stat-card"><div class="stat-value" id="statVendors">-</div><div class="stat-label">Vendors</div></div>
		<div class="stat-card"><div class="stat-value" id="statProducts">-</div><div class="stat-label">Products</div></div>
		<div class="stat-card"><div class="stat-value" id="statCategories">-</div><div class="stat-label">Categories</div></div>
		<div class="stat-card"><div class="stat-value" id="statSeries">-</div><div class="stat-label">Series</div></div>
	</div>

	<!-- Filters -->
	<div class="filter-bar">
		<div class="form-group">
			<label for="filterCategory">Product Category</label>
			<select id="filterCategory" class="form-select form-select-sm">
				<option value="">All Categories</option>
			</select>
		</div>
		<div class="form-group">
			<label for="filterSeries">Product Series</label>
			<select id="filterSeries" class="form-select form-select-sm">
				<option value="">All Series</option>
			</select>
		</div>
		<div class="form-group">
			<label for="filterVendor">Vendor Name</label>
			<select id="filterVendor" class="form-select form-select-sm">
				<option value="">All Vendors</option>
			</select>
		</div>
		<div class="form-group" style="align-self:flex-end;">
			<button class="btn btn-outline-secondary btn-sm" id="btnClearFilters">Clear Filters</button>
		</div>
	</div>

	<div class="stats-bar">
		Showing <strong id="rowCount">0</strong> of <strong id="totalCount">0</strong> records
	</div>

	<div id="cpe-table"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
	let allData = [];

	const table = new Tabulator("#cpe-table", {
		height: "70vh",
		layout: "fitDataFill",
		placeholder: "Loading data…",
		pagination: true,
		paginationSize: 50,
		paginationSizeSelector: [25, 50, 100, 250, 500],
		movableColumns: true,
		headerSortTriState: true,
		columns: [
			{
				title: "Vendor",
				field: "VendorName",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 160,
			},
			{
				title: "Product",
				field: "Product",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 200,
			},
			{
				title: "Category",
				field: "ProductCategory",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 160,
			},
			{
				title: "Series",
				field: "ProductSeries",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 150,
			},
			{
				title: "CPE Vendor",
				field: "cpe_vendor",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 150,
			},
			{
				title: "CPE Product",
				field: "cpe_product",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				width: 170,
			},
			{
				title: "CPE Match String",
				field: "cpe_match_string",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				minWidth: 280,
			},
			{
				title: "NVD API URL",
				field: "nvd_api_url",
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
				minWidth: 200,
				formatter: function (cell) {
					const v = cell.getValue();
					if (v) {
						const short = v.length > 50 ? v.substring(0, 50) + "…" : v;
						return `<a href="${encodeURI(v)}" target="_blank" rel="noopener">${short}</a>`;
					}
					return "";
				},
			},
		],
	});

	function refreshStats() {
		var rows = table.getRows("active");
		var items = rows.map(function (r) { return r.getData(); });
		document.getElementById("rowCount").textContent = items.length;
		document.getElementById("totalCount").textContent = allData.length;

		var vendors = new Set(), products = new Set(), categories = new Set(), series = new Set();
		items.forEach(function (r) {
			if (r.VendorName) vendors.add(r.VendorName);
			if (r.Product) products.add(r.Product);
			if (r.ProductCategory) categories.add(r.ProductCategory);
			if (r.ProductSeries) series.add(r.ProductSeries);
		});
		document.getElementById("statTotal").textContent = items.length.toLocaleString();
		document.getElementById("statVendors").textContent = vendors.size.toLocaleString();
		document.getElementById("statProducts").textContent = products.size.toLocaleString();
		document.getElementById("statCategories").textContent = categories.size.toLocaleString();
		document.getElementById("statSeries").textContent = series.size.toLocaleString();
	}

	table.on("dataFiltered", function () { setTimeout(refreshStats, 0); });

	/* Populate dropdown filters */
	function populateDropdown(selectId, values) {
		const sel = document.getElementById(selectId);
		const firstOpt = sel.options[0].textContent;
		sel.innerHTML = "";
		const allOpt = document.createElement("option");
		allOpt.value = "";
		allOpt.textContent = firstOpt;
		sel.appendChild(allOpt);
		values.sort().forEach(function (v) {
			const opt = document.createElement("option");
			opt.value = v;
			opt.textContent = v;
			sel.appendChild(opt);
		});
	}

	/* Fetch data */
	fetch("{{ url_for('cpe_mapping_api') }}")
		.then(function (res) { return res.json(); })
		.then(function (data) {
			if (data.error) {
				document.getElementById("cpe-table").innerHTML =
					'<div class="alert alert-danger">' + data.error + "</div>";
				return;
			}
			allData = data;
			table.setData(data).then(function () { refreshStats(); });

			/* Build unique values for dropdowns */
			const categories = new Set(), series = new Set(), vendors = new Set();
			data.forEach(function (r) {
				if (r.ProductCategory) categories.add(r.ProductCategory);
				if (r.ProductSeries) series.add(r.ProductSeries);
				if (r.VendorName) vendors.add(r.VendorName);
			});
			populateDropdown("filterCategory", Array.from(categories));
			populateDropdown("filterSeries", Array.from(series));
			populateDropdown("filterVendor", Array.from(vendors));
		})
		.catch(function (err) {
			document.getElementById("cpe-table").innerHTML =
				'<div class="alert alert-danger">Failed to load data: ' + err + "</div>";
		});

	/* Dropdown filter handlers */
	function applyDropdownFilters() {
		const filters = [];
		const cat = document.getElementById("filterCategory").value;
		const ser = document.getElementById("filterSeries").value;
		const ven = document.getElementById("filterVendor").value;
		if (cat) filters.push({ field: "ProductCategory", type: "=", value: cat });
		if (ser) filters.push({ field: "ProductSeries", type: "=", value: ser });
		if (ven) filters.push({ field: "VendorName", type: "=", value: ven });
		table.setFilter(filters);
	}

	document.getElementById("filterCategory").addEventListener("change", applyDropdownFilters);
	document.getElementById("filterSeries").addEventListener("change", applyDropdownFilters);
	document.getElementById("filterVendor").addEventListener("change", applyDropdownFilters);

	document.getElementById("btnClearFilters").addEventListener("click", function () {
		document.getElementById("filterCategory").value = "";
		document.getElementById("filterSeries").value = "";
		document.getElementById("filterVendor").value = "";
		table.clearFilter(true);
		table.clearHeaderFilter();
	});
});
</script>
{% endblock %}
