<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}SWDB Query Explorer{% endblock %}</title>

		<!-- Latest Bootstrap 5 (light theme) -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>

		<!-- Tabulator css (only used on pages that render tables) -->
		<link
			href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css"
			rel="stylesheet"
		/>

		<style>
			body {
				background-color: #f7f7fb;
			}

			.page-wrapper {
				padding: 2rem 1rem 3rem;
			}

			.navbar-brand {
				font-weight: 600;
			}
		</style>

		{% block extra_head %}{% endblock %}
	</head>

	<body>
		{% include "_navbar.html" %}

		<div class="page-wrapper">
			{% block content %}{% endblock %}
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
		{% block extra_scripts %}{% endblock %}
	</body>
</html>
