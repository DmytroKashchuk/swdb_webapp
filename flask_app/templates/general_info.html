{% extends "base.html" %}

{% block title %}{{ title }} — General Info{% endblock %}

{% block extra_head %}
<style>
	.page-intro {
		font-size: .9rem;
		color: #555;
		max-width: 900px;
		margin-bottom: 1.25rem;
	}
	.toolbar {
		display: flex;
		flex-wrap: wrap;
		gap: .6rem;
		align-items: center;
		margin-bottom: 1rem;
	}
	.toolbar .btn-sm {
		font-size: .8rem;
		padding: .4rem .75rem;
	}
	.col-toggle-panel {
		border: 1px solid #e0e0e0;
		border-radius: 6px;
		background: #fff;
		padding: .75rem 1rem;
		margin-bottom: 1rem;
		display: none;
	}
	.col-toggle-panel.open {
		display: block;
	}
	.col-toggle-grid {
		display: flex;
		flex-wrap: wrap;
		gap: .35rem 1.25rem;
	}
	.col-toggle-grid label {
		font-size: .82rem;
		color: #444;
		display: flex;
		align-items: center;
		gap: .35rem;
		margin: 0;
	}
	.stats-bar {
		font-size: .82rem;
		color: #666;
		margin-bottom: .5rem;
	}
	#data-table {
		font-size: .85rem;
	}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
	<h4 class="mb-3">{{ title }}</h4>

	{% if description %}
	<p class="page-intro">{{ description }}</p>
	{% endif %}

	<!-- Toolbar -->
	<div class="toolbar">
		<button class="btn btn-outline-secondary btn-sm" id="btnToggleCols">Show / Hide Columns</button>
		<button class="btn btn-outline-secondary btn-sm" id="btnDownload">Download CSV</button>
		<button class="btn btn-outline-secondary btn-sm" id="btnClearFilters">Clear Filters</button>
	</div>

	<!-- Column show/hide panel -->
	<div class="col-toggle-panel" id="colTogglePanel">
		<div class="col-toggle-grid" id="colToggleGrid"></div>
	</div>

	<div class="stats-bar">
		Showing <strong id="rowCount">0</strong> of <strong id="totalCount">0</strong> records
	</div>

	<div id="data-table"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
	const apiUrl = "{{ url_for('general_info_api', slug=slug) }}";
	const fileName = "{{ slug }}.csv";
	let allData = [];
	let colMeta = [];

	// Numeric header filter supporting <, >, <=, >=, = operators (e.g. ">100")
	function numericFilter(headerValue, rowValue) {
		if (headerValue === "" || headerValue === null || headerValue === undefined) return true;
		if (rowValue === null || rowValue === undefined || rowValue === "") return false;
		const m = String(headerValue).trim().match(/^(<=|>=|<|>|=)?\s*(-?\d+(?:\.\d+)?)$/);
		if (!m) return true; // invalid input -> don't filter out
		const op = m[1] || "=";
		const target = parseFloat(m[2]);
		const val = parseFloat(rowValue);
		if (isNaN(val)) return false;
		switch (op) {
			case "<": return val < target;
			case ">": return val > target;
			case "<=": return val <= target;
			case ">=": return val >= target;
			default: return val === target;
		}
	}

	function buildColumns(meta) {
		return meta.map(function (c) {
			if (c.numeric) {
				return {
					title: c.field,
					field: c.field,
					sorter: "number",
					headerFilter: "input",
					headerFilterPlaceholder: "e.g. >100",
					headerFilterFunc: numericFilter,
					formatter: function (cell) {
						const v = cell.getValue();
						return (v === null || v === undefined || v === "") ? "" : Number(v).toLocaleString();
					},
				};
			}
			return {
				title: c.field,
				field: c.field,
				headerFilter: "input",
				headerFilterPlaceholder: "Search…",
			};
		});
	}

	const table = new Tabulator("#data-table", {
		height: "68vh",
		layout: "fitDataFill",
		placeholder: "Loading data…",
		pagination: true,
		paginationSize: 50,
		paginationSizeSelector: [25, 50, 100, 250, 500],
		movableColumns: true,
		headerSortTriState: true,
	});

	function refreshStats() {
		const active = table.getRows("active").length;
		document.getElementById("rowCount").textContent = active.toLocaleString();
		document.getElementById("totalCount").textContent = allData.length.toLocaleString();
	}

	function buildColumnToggles() {
		const grid = document.getElementById("colToggleGrid");
		grid.innerHTML = "";
		colMeta.forEach(function (c) {
			const label = document.createElement("label");
			const cb = document.createElement("input");
			cb.type = "checkbox";
			cb.checked = true;
			cb.addEventListener("change", function () {
				if (cb.checked) table.showColumn(c.field);
				else table.hideColumn(c.field);
			});
			label.appendChild(cb);
			label.appendChild(document.createTextNode(c.field));
			grid.appendChild(label);
		});
	}

	table.on("dataFiltered", function () { setTimeout(refreshStats, 0); });

	fetch(apiUrl)
		.then(function (res) { return res.json(); })
		.then(function (data) {
			if (data.error) {
				document.getElementById("data-table").innerHTML =
					'<div class="alert alert-danger">' + data.error + "</div>";
				return;
			}
			colMeta = data.columns;
			allData = data.rows;
			table.setColumns(buildColumns(colMeta));
			table.setData(allData).then(function () {
				buildColumnToggles();
				refreshStats();
			});
		})
		.catch(function (err) {
			document.getElementById("data-table").innerHTML =
				'<div class="alert alert-danger">Failed to load data: ' + err + "</div>";
		});

	document.getElementById("btnToggleCols").addEventListener("click", function () {
		document.getElementById("colTogglePanel").classList.toggle("open");
	});
	document.getElementById("btnDownload").addEventListener("click", function () {
		table.download("csv", fileName);
	});
	document.getElementById("btnClearFilters").addEventListener("click", function () {
		table.clearFilter(true);
		table.clearHeaderFilter();
	});
});
</script>
{% endblock %}
